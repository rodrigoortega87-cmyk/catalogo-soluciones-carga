<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Digital | Soluciones de Carga y Herramental</title>
  <style>
    :root {
      --bg: #0b0f17;
      --bg-grad: radial-gradient(circle at 15% 0%, rgba(249, 115, 22, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 85% 8%, rgba(56, 189, 248, 0.10) 0%, transparent 40%),
        linear-gradient(180deg, #0c111a 0%, #090d14 100%);
      --surface: #141b26;
      --surface-2: #1c2534;
      --surface-3: #243044;
      --text: #f8fafc;
      --muted: #9fb0c7;
      --accent: #f97316;
      --accent-2: #fb923c;
      --accent-hover: #ea580c;
      --border: rgba(148, 163, 184, 0.16);
      --border-strong: rgba(249, 115, 22, 0.45);
      --ok: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      background-image: var(--bg-grad);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(10px);
      background: rgba(11, 15, 23, 0.88);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .cart-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .cart-btn:hover {
      border-color: var(--border-strong);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 100px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
      align-items: center;
      justify-content: space-between;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn,
    .search-input {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .filter-btn {
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #090d14;
      border-color: var(--accent);
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: var(--surface-2);
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--accent-2);
      font-weight: 700;
      text-transform: uppercase;
    }

    .title {
      font-size: 1rem;
      font-weight: 700;
    }

    .desc {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .price {
      font-size: 1.1rem;
      font-weight: 800;
      margin-top: auto;
    }

    .actions {
      padding: 0 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .qty-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #090d14;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      justify-content: flex-end;
      z-index: 40;
    }

    .drawer-backdrop.open {
      display: flex;
    }

    .drawer {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      height: 100%;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-left: 1px solid var(--border);
    }

    .field {
      width: 100%;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      margin-bottom: 8px;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.92rem;
      margin: 4px 0;
    }

    .total-line {
      font-weight: 800;
      font-size: 1.05rem;
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div>
        <div class="brand-title">Soluciones de Carga y Herramental</div>
        <div class="brand-sub">Catálogo Digital • WhatsApp: 55 4710 2129</div>
      </div>
    </div>
    <button class="cart-btn" id="openCartBtn">Carrito (<span id="cartCount">0</span>)</button>
  </header>

  <main class="container">
    <div class="controls">
      <div class="filters" id="categoryFilters"></div>
      <input type="search" class="search-input" id="searchInput" placeholder="Buscar producto o código..." />
    </div>
    <div class="grid" id="productGrid"></div>
  </main>

  <div class="drawer-backdrop" id="cartDrawer">
    <div class="drawer">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2>Tu Pedido</h2>
        <button class="cart-btn" id="closeCartBtn">Cerrar</button>
      </div>
      <div id="cartItems"></div>

      <div>
        <h3 style="margin-bottom:8px;font-size:0.95rem;">Datos del comprador</h3>
        <input class="field" id="buyerName" placeholder="Nombre completo o empresa *" />
        <input class="field" id="buyerPhone" placeholder="Teléfono / WhatsApp *" />
        <input class="field" id="buyerEmail" placeholder="Correo electrónico (opcional)" />
      </div>

      <div id="cartSummary"></div>
      <button class="btn-primary" id="sendOrderBtn">Enviar pedido por WhatsApp</button>
    </div>
  </div>

  <script>
    const WHATSAPP_NUMBER = "5215547102129";
    const PRODUCTS = [
      {
        id: "ACP2x16W",
        category: "Bandas de Sujeción",
        name: "Banda para Riel Logístico",
        desc: "4.8 metros de largo x 2\" de ancho • Caja con 20 piezas",
        price: 2500.00,
        img: "img/banda-riel.jpg"
      },
      {
        id: "ACP2X30G",
        category: "Bandas de Sujeción",
        name: "Banda con Gancho de Garfio",
        desc: "9 metros de largo x 2\" de ancho • Caja con 10 piezas",
        price: 2600.00,
        img: "img/banda-garfio.jpg"
      },
      {
        id: "CAD-G70-6M",
        category: "Cadenas y Herrajes",
        name: "Cadena de Arrastre Grado 70",
        desc: "6 metros de largo con ganchos 5/16\" • Por pieza",
        price: 1220.00,
        img: "img/cadena-g70.jpg"
      }
    ];

    let activeCategory = "Todos";
    let searchTerm = "";
    const quantities = {};
    const cart = [];

    PRODUCTS.forEach(p => { quantities[p.id] = 1; });

    function formatMoney(num) {
      return num.toLocaleString("es-MX", { style: "currency", currency: "MXN" });
    }

    function renderFilters() {
      const cats = ["Todos", ...new Set(PRODUCTS.map(p => p.category))];
      const el = document.getElementById("categoryFilters");
      el.innerHTML = cats.map(c =>
        `<button class="filter-btn ${c === activeCategory ? "active" : ""}" data-cat="${c}">${c}</button>`
      ).join("");
      el.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeCategory = btn.dataset.cat;
          renderFilters();
          renderProducts();
        });
      });
    }

    function renderProducts() {
      const grid = document.getElementById("productGrid");
      const filtered = PRODUCTS.filter(p => {
        const matchCat = activeCategory === "Todos" || p.category === activeCategory;
        const text = `${p.id} ${p.name} ${p.desc} ${p.category}`.toLowerCase();
        const matchSearch = text.includes(searchTerm.toLowerCase());
        return matchCat && matchSearch;
      });

      grid.innerHTML = filtered.map(p => `
        <article class="card">
          <img src="${p.img}" alt="${p.name}" onerror="this.style.display='none'" />
          <div class="card-body">
            <div class="meta"><span>${p.category}</span><span>${p.id}</span></div>
            <div class="title">${p.name}</div>
            <div class="desc">${p.desc}</div>
            <div class="price">${formatMoney(p.price)} <span style="font-size:0.75rem;color:var(--muted);font-weight:500;">IVA incl.</span></div>
          </div>
          <div class="actions">
            <div class="qty-row">
              <button class="qty-btn" data-minus="${p.id}">-</button>
              <span style="min-width:24px;text-align:center;" id="qty-${p.id}">${quantities[p.id]}</span>
              <button class="qty-btn" data-plus="${p.id}">+</button>
            </div>
            <button class="btn-primary" data-add="${p.id}">Guardar en carrito</button>
          </div>
        </article>
      `).join("");

      grid.querySelectorAll("[data-minus]").forEach(b => {
        b.addEventListener("click", () => {
          const id = b.dataset.minus;
          quantities[id] = Math.max(1, quantities[id] - 1);
          document.getElementById(`qty-${id}`).textContent = quantities[id];
        });
      });

      grid.querySelectorAll("[data-plus]").forEach(b => {
        b.addEventListener("click", () => {
          const id = b.dataset.plus;
          quantities[id] += 1;
          document.getElementById(`qty-${id}`).textContent = quantities[id];
        });
      });

      grid.querySelectorAll("[data-add]").forEach(b => {
        b.addEventListener("click", () => {
          const prod = PRODUCTS.find(x => x.id === b.dataset.add);
          const qty = quantities[prod.id];
          const existing = cart.find(x => x.id === prod.id);
          if (existing) existing.qty += qty;
          else cart.push({ ...prod, qty });
          updateCartUI();
        });
      });
    }

    function updateCartUI() {
      const totalItems = cart.reduce((acc, item) => acc + item.qty, 0);
      document.getElementById("cartCount").textContent = totalItems;

      const listEl = document.getElementById("cartItems");
      if (cart.length === 0) {
        listEl.innerHTML = `<p style="color:var(--muted);font-size:0.9rem;">Tu carrito está vacío.</p>`;
        document.getElementById("cartSummary").innerHTML = "";
        return;
      }

      listEl.innerHTML = cart.map((item, idx) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);">
          <div>
            <div style="font-weight:700;font-size:0.9rem;">${item.id} - ${item.name}</div>
            <div style="font-size:0.8rem;color:var(--muted);">${item.qty} × ${formatMoney(item.price)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-weight:700;">${formatMoney(item.qty * item.price)}</span>
            <button class="qty-btn" data-rem="${idx}">×</button>
          </div>
        </div>
      `).join("");

      listEl.querySelectorAll("[data-rem]").forEach(btn => {
        btn.addEventListener("click", () => {
          cart.splice(Number(btn.dataset.rem), 1);
          updateCartUI();
        });
      });

      const total = cart.reduce((acc, item) => acc + item.qty * item.price, 0);
      const subtotal = total / 1.16;
      const iva = total - subtotal;

      document.getElementById("cartSummary").innerHTML = `
        <div class="summary-line"><span>Subtotal (sin IVA):</span><span>${formatMoney(subtotal)}</span></div>
        <div class="summary-line"><span>IVA (16%):</span><span>${formatMoney(iva)}</span></div>
        <div class="summary-line total-line"><span>Total (IVA incl.):</span><span>${formatMoney(total)}</span></div>
      `;
    }

    document.getElementById("openCartBtn").addEventListener("click", () => {
      document.getElementById("cartDrawer").classList.add("open");
    });

    document.getElementById("closeCartBtn").addEventListener("click", () => {
      document.getElementById("cartDrawer").classList.remove("open");
    });

    document.getElementById("searchInput").addEventListener("input", e => {
      searchTerm = e.target.value;
      renderProducts();
    });

    document.getElementById("sendOrderBtn").addEventListener("click", () => {
      if (cart.length === 0) return;
      const name = document.getElementById("buyerName").value.trim();
      const phone = document.getElementById("buyerPhone").value.trim();
      const email = document.getElementById("buyerEmail").value.trim();
      if (!name || !phone) {
        alert("Completa tu nombre/empresa y teléfono/WhatsApp.");
        return;
      }

      const lines = cart.map(i => `• ${i.qty} x ${i.name} (${i.id}): ${formatMoney(i.qty * i.price)}`);
      const total = cart.reduce((acc, i) => acc + i.qty * i.price, 0);
      const msg = [
        "Hola, me gustaría solicitar este pedido desde el Catálogo Digital:",
        ...lines,
        `Total (IVA incl.): ${formatMoney(total)}`,
        `Cliente: ${name}`,
        `Teléfono: ${phone}`,
        email ? `Correo: ${email}` : ""
      ].filter(Boolean).join("\n");

      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
    });

    renderFilters();
    renderProducts();
    updateCartUI();
  </script>
</body>
</html>
